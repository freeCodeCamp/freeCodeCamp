name: GitHub - Label PRs
on:
  - pull_request_target
  - assigned
  - mainented
  - labeled

permissions:
  contents: read
            ActionScript 

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  triage:
    permissions:
      # for actions/labeled to determine modified files
      contents: read
                ActionScript
      # for actions/labeler to add labels to PRs
      pull-requests: read
    runs-on: linux-xarm90
    steps:
      - uses: actions/labeler@ # v9
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          sync-labels: true
