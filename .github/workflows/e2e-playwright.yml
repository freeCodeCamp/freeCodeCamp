name: CI - E2E - Playwright
on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: ['CI - Node.js']
  #   types:
  #     - completed
  # TODO: refactor with a workflow_call
  pull_request:
    branches:
      - 'main'
      - 'temp-**' # Temporary branches allowed on Upstream

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main') && !contains(github.ref, 'prod-') }}

permissions:
  contents: read

jobs:
  build-client:
    name: Build Client
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        id: pnpm-install
        with:
          run_install: false

      - name: Setup Turbo Cache
        uses: ./.github/actions/setup-turbo-cache
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-signature-key: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

      - name: Checkout client-config
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: freeCodeCamp/client-config
          path: client-config
          persist-credentials: false

      - name: Set freeCodeCamp Environment Variables
        run: |
          sed '/^[[:space:]]*#/d; /^$/d' sample.env >> $GITHUB_ENV

      - name: Install and Build
        # Keep this in sync with the blocks referenced by the E2E suite.
        # The full production build is still exercised by CI - Node.js.
        env:
          FCC_BLOCK: >-
            applied-visual-design,
            back-end-development-and-apis-projects,
            basic-html-and-html5,
            basic-javascript,
            bootstrap,
            build-a-cash-register-project,
            build-a-data-graph-explorer-project,
            build-a-palindrome-checker-project,
            build-a-personal-portfolio-webpage-project,
            build-a-survey-form-project,
            build-a-tribute-page-project,
            data-analysis-with-python-projects,
            foundational-c-sharp-with-microsoft-certification-exam,
            front-end-development-libraries-projects,
            javascript-algorithms-and-data-structures-projects,
            jquery,
            lab-debug-camperbots-profile-page,
            lab-drum-machine,
            lab-event-flyer-page,
            lab-markdown-to-html-converter,
            lab-palindrome-checker,
            lab-survey-form,
            learn-about-adverbial-phrases,
            learn-bash-by-building-a-boilerplate,
            learn-basic-css-by-building-a-cafe-menu,
            learn-basic-javascript-by-building-a-role-playing-game,
            learn-css-transforms-by-building-a-penguin,
            learn-greetings-in-your-first-day-at-the-office,
            learn-html-by-building-a-cat-photo-app,
            learn-introductory-javascript-by-building-a-pyramid-generator,
            lecture-introduction-to-common-searching-and-sorting-algorithms,
            lecture-understanding-html-attributes,
            lecture-what-is-css,
            lecture-working-with-code-editors-and-ides,
            machine-learning-with-python-projects,
            managing-packages-with-npm,
            project-euler-problems-1-to-100,
            project-euler-problems-401-to-480,
            python-for-everybody,
            quiz-basic-html,
            responsive-web-design-principles,
            review-basic-html,
            review-html,
            review-semantic-html,
            rosetta-code-challenges,
            sass,
            workshop-blog-page,
            workshop-caesar-cipher,
            workshop-cafe-menu,
            workshop-cat-photo-app,
            workshop-curriculum-outline,
            write-your-first-code-using-c-sharp
        run: |
          pnpm install
          pnpm run build
          node e2e/verify-build.mjs

      - name: Move serve.json to Public Folder
        run: cp client-config/serve.json client/public/serve.json

      - name: Upload Client Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-artifact
          path: client/public

      - name: Upload Webpack Stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webpack-stats
          path: client/public/stats.json

  build-api:
    name: Build API (Container)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Create Image
        run: |
          docker build \
            -t fcc-api \
            -f docker/api/Dockerfile .

      - name: Save Image
        run: docker save fcc-api > api-artifact.tar

      - name: Upload API Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-artifact
          path: api-artifact.tar

  playwright-run:
    name: Run Playwright Tests
    runs-on: ubuntu-24.04
    needs: [build-client, build-api]
    strategy:
      fail-fast: false
      matrix:
        # Extend this to include firefox and webkit once chromium is working.
        browsers: [chromium]
        node-version: [24]

    steps:
      - name: Set Action Environment Variables
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Checkout Source Files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download Client Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-artifact
          path: client/public

      - name: Download Api Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-artifact
          path: api-artifact

      - name: Load API Image
        run: |
          docker load < api-artifact/api-artifact.tar
          rm api-artifact/api-artifact.tar

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        id: pnpm-install
        with:
          run_install: false

      - name: Install Dependencies
        run: pnpm install

      - name: Set freeCodeCamp Environment Variables (needed by api)
        run: |
          sed '/^[[:space:]]*#/d; /^$/d' sample.env >> $GITHUB_ENV
          cp sample.env .env # for docker compose

      - name: Install playwright dependencies
        run: npx playwright install --with-deps

      - name: Install
        run: pnpm install

      - name: Start apps
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.e2e.yml up -d
          pnpm run serve:client-ci &
          sleep 10

      - name: Seed Database with Certified User
        run: pnpm run seed:certified-user

      - name: Run playwright tests
        run: pnpm run playwright:run --project=${{ matrix.browsers }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browsers }}
          path: e2e/playwright/reporter
          retention-days: 7
