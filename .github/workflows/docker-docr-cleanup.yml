name: CD - Docker - DOCR Cleanup Container Images
on:
  workflow_dispatch:
  schedule:
    - cron: '5 0 * * 3,6'

jobs:
  remove:
    name: Delete Old Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repos:
          - learn-api
          - learn-client-ara
          - learn-client-chn
          - learn-client-cnt
          - learn-client-eng
          - learn-client-esp
          - learn-client-ger
          - learn-client-ita
          - learn-client-jpn
          - learn-client-kor
          - learn-client-por
          - learn-client-swa
          - learn-client-ukr
        variants:
          - dev
          - org

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 1200

      - name: Check the repository exists
        id: repo
        env:
          REPOSITORY: ${{ matrix.variants }}/${{ matrix.repos }}
        run: |
          if tags=$(doctl registry repository list-tags "$REPOSITORY" --output json); then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif jq -e 'any(.errors[]?; .status == 404)' <<<"$tags" >/dev/null 2>&1; then
            echo "::notice::No repository $REPOSITORY in DOCR, cleanup skipped"
          else
            echo "::error::Could not list the tags of $REPOSITORY"
            exit 1
          fi

      - name: Delete Images
        if: steps.repo.outputs.found == 'true'
        uses: raisedadead/action-docr-cleanup@1c7d87369bccfdf5da03a9ae3b00eacc3f2a9b51 # v1
        with:
          repository_name: '${{ matrix.variants }}/${{ matrix.repos }}'
          days: '7'
          keep_last: '3'

