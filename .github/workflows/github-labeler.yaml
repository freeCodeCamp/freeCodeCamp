name: GitHub - Label PRs
on:
  - pull_request_target

permissions:
  contents: read

concurrency:
  # Shared with the "GitHub - PR Contribution Guidelines" workflow so both
  # label-updating workflows run one at a time per PR. Running concurrently,
  # this workflow could compute its label set before the guidelines workflow
  # adds a label (e.g. "deprioritized") and drop it when writing, since
  # sync-labels replaces the label set it manages.
  # See https://github.com/freeCodeCamp/freeCodeCamp/issues/70526
  group: 'pr-labels-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}'
  cancel-in-progress: false

jobs:
  triage:
    permissions:
      # for actions/labeler to determine modified files
      contents: read
      # for actions/labeler to add labels to PRs
      pull-requests: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          sync-labels: true
