name: GitHub - Label PRs
on:
  - pull_request_target

permissions:
  contents: read

concurrency:
  group: pr-label-writes-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  triage:
    permissions:
      # for actions/labeler to determine modified files
      contents: read
      # for actions/labeler to add labels to PRs
      pull-requests: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          sync-labels: true
