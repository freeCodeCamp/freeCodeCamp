name: freecodecamp-local

services:
  db:
    image: mongo:8.2
    container_name: mongodb
    command: mongod --replSet rs0
    restart: unless-stopped
    hostname: mongodb
    ports:
      - 27017:27017
    volumes:
      - db-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 2s
      retries: 5

  setup:
    image: mongo:8.2
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    # This will try to initiate the replica set, until it succeeds twice (i.e. until the replica set is already initialized)
    command: >
      mongosh --host mongodb:27017 --eval '
        var cfg = {
          _id: "rs0",
          members: [
            { _id: 0, host: "mongodb:27017" }
          ]
        };
        try {
          rs.initiate(cfg);
        } catch (err) {
          if(err.codeName !== "AlreadyInitialized") throw err;
        }
      '

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - 8123:8123
      - 9000:9000
    environment:
      CLICKHOUSE_DB: freecodecamp
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../api/clickhouse/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD',
          'clickhouse-client',
          '--password',
          'clickhouse',
          '--query',
          'SELECT 1'
        ]
      interval: 2s
      retries: 10

  mailpit:
    restart: unless-stopped
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  db-data:
    driver: local
  clickhouse-data:
    driver: local
