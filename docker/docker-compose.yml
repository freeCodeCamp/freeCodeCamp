name: freecodecamp-local

services:
  db:
    image: mongo:8.2
    command: mongod --replSet rs0
    restart: unless-stopped
    hostname: mongodb
    volumes:
      - db-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 2s
      retries: 5
      start_period: 10s

  setup:
    image: mongo:8.2
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure:5
    command: >
      mongosh --host mongodb:27017 --eval '
        try {
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
        } catch (err) {
          if (err.codeName !== "AlreadyInitialized") throw err;
        }
      '

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - 8123:8123
      - 9000:9000
    environment:
      CLICKHOUSE_DB: freecodecamp
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../api/clickhouse/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD',
          'clickhouse-client',
          '--password',
          'clickhouse',
          '--query',
          'SELECT 1'
        ]
      interval: 2s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped

volumes:
  db-data:
    driver: local
  clickhouse-data:
    driver: local
